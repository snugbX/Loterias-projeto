name: Testes e deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lottery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-temporary-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lottery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ''
      APP_SECRET_KEY: ci-only-not-production
      LOTTERY_USE_ML: '0'
      LOTTERY_AUTO_UPDATE: '0'
      SESSION_COOKIE_SECURE: '0'
      TEST_DATABASE_URL: postgresql://postgres:ci-temporary-only@127.0.0.1:5432/lottery_test
      DATABASE_SSLMODE: disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            src/requirements-admin.txt
      - run: python -m pip install -r src/requirements.txt
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Solicitar deploy depois dos testes
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: python3 src/trigger_render_deploy.py
