name: Atualizar resultados publicos

on:
  schedule:
    # UTC: 22:17, 01:17 e 09:17 no horario da Bahia.
    - cron: '17 1,4,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ''
      LOTTERY_DATA_DIR: .
      LOTTERY_USE_ML: '0'
      LOTTERY_AUTO_UPDATE: '0'
      LOTTERY_PUBLISH_AFTER_UPDATE: '0'
      APP_SECRET_KEY: ci-only-not-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            src/requirements-admin.txt
      - run: python -m pip install -r src/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Atualizar e publicar somente CSVs novos
        id: update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          previous=$(git rev-parse HEAD)
          python src/update_lottery_data.py --publish
          if [ "$previous" != "$(git rev-parse HEAD)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Solicitar deploy com os novos resultados
        if: steps.update.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: python src/trigger_render_deploy.py
